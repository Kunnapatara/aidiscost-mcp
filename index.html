      // In modern browsers, window.fetch is an accessor property (getter only) on Window.prototype.
      // If external tooling, dev harnesses, or dependencies attempt to assign `window.fetch = ...`,
      // strict mode runtimes throw "TypeError: Cannot set property fetch of #<Window> which has only a getter".
      // We safely configure a setter that updates the active fetch reference while preserving native fetch behavior.
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch');
          if (desc && desc.get && !desc.set) {
            var _activeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return _activeFetch; },
              set: function(fn) { _activeFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Non-blocking in locked/sealed environments
        }
      })();
