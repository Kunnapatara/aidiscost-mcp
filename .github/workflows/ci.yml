name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: TypeScript & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run lint

  test:
    name: Unit & HTTP Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun run test

  local-migrations:
    name: Local Migration Verification (0000 -> 0008)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Versioned Database Migrations (Local libSQL)
        run: bun run db:migrate
        env:
          TURSO_DATABASE_URL: "file:data/ci-test.db"

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production Build
        run: bun run build

  remote-turso-migrations:
    name: Remote Turso Test Database Verification
    runs-on: ubuntu-latest
    needs: [local-migrations]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Remote Turso Credentials
        id: check_turso_creds
        run: |
          if [ -n "${{ secrets.TURSO_TEST_DATABASE_URL }}" ] && [ -n "${{ secrets.TURSO_TEST_AUTH_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice ::Remote Turso credentials not configured in GitHub Secrets. Marking Remote Turso verification as BLOCKED / SKIPPED."
          fi

      - name: Execute Remote Turso Migrations Test
        if: steps.check_turso_creds.outputs.has_creds == 'true'
        run: bun run test:turso
        env:
          TURSO_TEST_DATABASE_URL: ${{ secrets.TURSO_TEST_DATABASE_URL }}
          TURSO_TEST_AUTH_TOKEN: ${{ secrets.TURSO_TEST_AUTH_TOKEN }}
          TURSO_TEST_DATABASE_ID: ${{ secrets.TURSO_TEST_DATABASE_ID }}
          TURSO_TEST_DATABASE_ALLOWLIST: ${{ secrets.TURSO_TEST_DATABASE_ALLOWLIST }}

  sandbox-e2e:
    name: Lemon Squeezy Sandbox E2E Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Lemon Squeezy Sandbox Credentials
        id: check_sandbox_creds
        run: |
          if [ -n "${{ secrets.LEMON_SQUEEZY_SANDBOX_API_KEY }}" ] && [ -n "${{ secrets.LEMON_SQUEEZY_STORE_ID }}" ] && [ -n "${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice ::Lemon Squeezy Sandbox credentials not configured in GitHub Secrets. Marking Sandbox E2E as BLOCKED / SKIPPED."
          fi

      - name: Execute Lemon Squeezy Sandbox E2E Runner
        if: steps.check_sandbox_creds.outputs.has_creds == 'true'
        run: bun run test:sandbox
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          LEMON_SQUEEZY_SANDBOX: "true"
          LEMON_SQUEEZY_SANDBOX_API_KEY: ${{ secrets.LEMON_SQUEEZY_SANDBOX_API_KEY }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_FIX_PACKAGE_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_FIX_PACKAGE_VARIANT_ID }}
          LEMON_SQUEEZY_OUTCOME_FEE_VARIANT_ID: ${{ secrets.LEMON_SQUEEZY_OUTCOME_FEE_VARIANT_ID }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_WEBHOOK_URL: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_URL }}
